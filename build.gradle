plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories { mavenCentral() }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Unit tests cover the pure-Java plan core (dev.dwoodard.voxelpilot.plan), which has no
    // Minecraft imports; Gson comes from the Minecraft classpath.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure { useJUnitPlatform() }

// Copy the finished jar into a Minecraft instance's mods folder after every build.
// Set modsDir in the git-ignored local.properties (or pass -PmodsDir=...); without it,
// build behaves normally and nothing is copied.
def localProps = new Properties()
if (file('local.properties').exists()) file('local.properties').withInputStream { localProps.load(it) }
def modsDir = project.findProperty('modsDir') ?: localProps.getProperty('modsDir')

// Written under a temporary name, then atomically renamed over the old jar. Overwriting in
// place corrupts a running game's view of its jar (lazy class loading then fails with
// NoClassDefFoundError); after a rename, a running game keeps its original file until restart.
tasks.register('installMod') {
    dependsOn 'reobfJar'
    onlyIf { modsDir != null }
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    doLast {
        def source = jarFile.get().asFile.toPath()
        def dir = java.nio.file.Paths.get(modsDir.toString())
        def target = dir.resolve(source.fileName.toString())
        def temp = dir.resolve(source.fileName.toString() + '.installing')
        java.nio.file.Files.copy(source, temp, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        java.nio.file.Files.move(temp, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
        println "VoxelPilot installed to ${modsDir} (restart Minecraft to load it)"
    }
}
if (modsDir != null) tasks.named('build') { finalizedBy 'installMod' }

// Offline check of the planning prompt against a real model (no Minecraft needed):
//   ./bootstrap.sh evalPlans -PevalModel=qwen/qwen3.5-9b [-PevalUrl=http://127.0.0.1:1234/v1]
tasks.register('evalPlans', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.dwoodard.voxelpilot.eval.PlanEval'
    args = [project.findProperty('evalModel') ?: '', project.findProperty('evalUrl') ?: '']
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
